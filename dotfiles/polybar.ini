; ============================================
; 1. macOS Top Menu Bar with Centered Spaces
; ============================================
[bar/macos-top]
width = 100%
height = 22pt
fixed-center = true
background = #6010121c
foreground = #e6edf3
padding-left = 2
padding-right = 2
module-margin = 2

line-size = 1pt
border-bottom-size = 1pt
border-bottom-color = #1affffff

font-0 = "JetBrainsMono Nerd Font:size=9.5;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=9.5;2"
font-2 = "JetBrainsMono Nerd Font:size=12;3"

modules-left = mac-logo mac-app mac-go mac-win mac-help mac-more
modules-center = macos-spaces
modules-right = media-player wlan pulseaudio battery date

cursor-click = pointer
override-redirect = true

[module/mac-logo]
type = custom/text
content = ""
content-font = 3
content-foreground = #ffffff
content-padding = 1
click-left = rofi -show drun -theme ~/.config/glasswm/rofi/start_menu.rasi

[module/mac-app]
type = internal/xwindow
label = %title:0:18:...%
label-font = 2
label-foreground = #ffffff

[module/mac-go]
type = custom/text
content = "Go"
content-foreground = #cdd6f4
click-left = thunar &

[module/mac-win]
type = custom/text
content = "Window"
content-foreground = #a6adc8
click-left = kate &

[module/mac-help]
type = custom/text
content = "Help"
content-foreground = #a6adc8

[module/mac-more]
type = custom/text
content = "•••"
content-foreground = #6c7086

; Centered Spaces capsule with matching Rofi theme
[module/macos-spaces]
type = custom/script
exec = ~/.config/glasswm/scripts/watch_desktops.sh
tail = true
format = <label>

[module/media-player]
type = custom/text
content = "♪ Midnight City"
content-foreground = #bac2de

[module/wlan]
type = internal/network
interface-type = wireless
label-connected = "󰤨"
label-disconnected = "󰤭"

[module/pulseaudio]
type = internal/pulseaudio
label-volume = "󰕾"
label-muted = "󰝟"

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
format-charging = "󰂄"
format-discharging = "󰁹"
poll-interval = 10

[module/date]
type = internal/date
interval = 1
date = "%a %b %d  %I:%M %p"
label = %date%
label-font = 1
label-foreground = #ffffff

; ============================================
; 2. Lumen Bottom Dock with Open-App Taskbar
; ============================================
[bar/lumen-dock]
bottom = true
width = 100%
height = 32pt
fixed-center = true
background = #7510121c
foreground = #e6edf3
padding-left = 3
padding-right = 3
module-margin = 2

border-top-size = 1pt
border-top-color = #1affffff

font-0 = "JetBrainsMono Nerd Font:size=9.5;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=9.5;2"
font-2 = "JetBrainsMono Nerd Font:size=13;3"

modules-left = dock-orb dock-search dock-split
modules-center = open-apps-taskbar
modules-right = dock-tray

cursor-click = pointer
override-redirect = true

[module/dock-orb]
type = custom/text
content = "󰣆"
content-font = 2
content-foreground = #8c7ae6
content-padding = 1
click-left = rofi -show drun -theme ~/.config/glasswm/rofi/start_menu.rasi

[module/dock-search]
type = custom/text
content = "   Search "
content-font = 1
content-foreground = #7a7c8d
content-background = #1affffff
click-left = rofi -show drun -theme ~/.config/glasswm/rofi/start_menu.rasi

[module/dock-split]
type = custom/text
content = "󰘳"
content-font = 2
content-foreground = #cdd6f4
content-padding = 1

[module/open-apps-taskbar]
type = custom/script
exec = ~/.config/glasswm/scripts/watch_tasks.sh
tail = true
format = <label>

[module/dock-tray]
type = internal/tray
tray-size = 14pt
tray-spacing = 6pt

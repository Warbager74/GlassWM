backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
vsync = true;
xrender-sync-fence = false;

# Lumen Fluid Dual-Kawase Blur (Zero dropped frames)
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

corner-radius = 16;
rounded-corners-exclude = [
  "window_type = 'desktop'"
];

# Soft Ambient Shadow
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.35;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Instant window tiling response (No laggy resize fading)
fading = false;

opacity-rule = [
  "92:class_g = 'Rofi'",
  "82:class_g = 'kitty'",
  "82:class_g = 'Alacritty'",
  "92:class_g = 'Polybar'",
  "88:class_g = 'Thunar'",
  "88:class_g = 'Kate'"
];

[bar/top]
width = 100%
height = 30pt
radius = 0
fixed-center = true

background = #99121218
foreground = #e6edf3

line-size = 2pt
border-size = 0pt

padding-left = 2
padding-right = 2
module-margin = 2

font-0 = "JetBrainsMono Nerd Font:size=11;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
font-2 = "JetBrainsMono Nerd Font:size=14;4"

modules-left = mac-logo xwindow
modules-center = date
modules-right = pulseaudio wlan battery

cursor-click = pointer
enable-ipc = true
override-redirect = true

[module/mac-logo]
type = custom/text
content = ""
content-font = 3
content-foreground = #ffffff
content-padding = 1
click-left = rofi -show drun -theme ~/.config/glasswm/rofi/config.rasi

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = #c9d1d9

[module/date]
type = internal/date
interval = 1
date = "%a %b %d  %I:%M %p"
label = %date%
label-font = 2
label-foreground = #ffffff

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
label-muted = "󰝟 muted"
label-muted-foreground = #768390

[module/wlan]
type = internal/network
interface-type = wireless
label-connected = "󰤨"
label-disconnected = "󰤭"

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = ADP1
poll-interval = 5
format-charging = "󰂄 <label-charging>%"
format-discharging = "󰁹 <label-discharging>%"

backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;

# Liquid Glass Dual-Kawase Blur
blur: {
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-frame = true;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Rounded Corners
corner-radius = 16;
rounded-corners-exclude = [
  "window_type = 'desktop'"
];

# Liquid Shadows
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.35;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-exclude = [
  "name = 'Notification'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fluid Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# Frosted Glass Opacity Rules
opacity-rule = [
  "88:class_g = 'Rofi'",
  "85:class_g = 'Alacritty'",
  "85:class_g = 'kitty'",
  "92:class_g = 'Polybar'"
];
